<!DOCTYPE html>
<html>
<head>
    <title>Auth Test</title>
</head>
<body>
    <h1>Authentication Test</h1>
    <button onclick="testLogin()">Test Admin Login</button>
    <button onclick="checkStorage()">Check Storage</button>
    <button onclick="clearStorage()">Clear Storage</button>
    <div id="results"></div>

    <script>
        async function testLogin() {
            try {
                const response = await fetch('http://localhost:5000/api/auth/login', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json'
                    },
                    body: JSON.stringify({
                        email: 'admin@careeriq.com',
                        password: 'admin@123'
                    })
                });
                
                const data = await response.json();
                console.log('Login Response:', data);
                
                if (data.success) {
                    // Store in both storages
                    localStorage.setItem('token', data.data.token);
                    localStorage.setItem('role', data.data.user.role);
                    sessionStorage.setItem('token', data.data.token);
                    sessionStorage.setItem('role', data.data.user.role);
                    
                    document.getElementById('results').innerHTML = 
                        '<h2 style="color: green;">✅ Login Successful!</h2>' +
                        '<p>Token: ' + data.data.token + '</p>' +
                        '<p>Role: ' + data.data.user.role + '</p>';
                } else {
                    document.getElementById('results').innerHTML = 
                        '<h2 style="color: red;">❌ Login Failed!</h2>' +
                        '<p>Error: ' + data.message + '</p>';
                }
            } catch (error) {
                console.error('Login Error:', error);
                document.getElementById('results').innerHTML = 
                    '<h2 style="color: red;">❌ Network Error</h2>' +
                    '<p>' + error.message + '</p>';
            }
        }
        
        function checkStorage() {
            const token = localStorage.getItem('token') || sessionStorage.getItem('token');
            const role = localStorage.getItem('role') || sessionStorage.getItem('role');
            
            document.getElementById('results').innerHTML = 
                '<h3>Current Storage:</h3>' +
                '<p><strong>Token:</strong> ' + (token || 'Not found') + '</p>' +
                '<p><strong>Role:</strong> ' + (role || 'Not found') + '</p>';
        }
        
        function clearStorage() {
            localStorage.clear();
            sessionStorage.clear();
            document.getElementById('results').innerHTML = 
                '<h2 style="color: orange;">🗑️ Storage Cleared</h2>';
        }
    </script>
</body>
</html>
